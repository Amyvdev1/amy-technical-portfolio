name: Package Career Evidence Vercel Shell

on:
  push:
    branches: [career-evidence/portfolio-positioning]
    paths:
      - .github/workflows/package-career-vercel-shell.yml

permissions:
  contents: write

jobs:
  package:
    name: Build verified portfolio into vercel-shell
    runs-on: ubuntu-latest
    steps:
      - name: Check out positioning branch
        uses: actions/checkout@v4
        with:
          ref: career-evidence/portfolio-positioning
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify portfolio before packaging
        run: |
          pnpm test:portfolio
          pnpm verify:product-engineering
          pnpm check
          pnpm verify:recruiter-proof
          pnpm build
          pnpm verify:bundle

      - name: Package production build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vercel-shell
          mkdir -p vercel-shell
          cp -R dist/public/. vercel-shell/
          cat > vercel-shell/vercel.json <<'JSON'
          {
            "rewrites": [
              { "source": "/(.*)", "destination": "/index.html" }
            ]
          }
          JSON

      - name: Commit generated shell
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A vercel-shell
          if git diff --cached --quiet; then
            echo "No generated shell changes."
            exit 0
          fi
          git commit -m "chore: rebuild Vercel shell for career evidence positioning"
          git push origin HEAD:career-evidence/portfolio-positioning
