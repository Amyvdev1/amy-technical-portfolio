name: Verify Signal Engine Portfolio

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Tests, typecheck, proof checks, production build, and bundle budgets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run portfolio evidence tests
        run: pnpm test:portfolio
      - name: Verify product engineering hygiene
        run: pnpm verify:product-engineering
      - name: Typecheck
        run: pnpm check
      - name: Verify recruiter proof path
        run: pnpm verify:recruiter-proof
      - name: Build production portfolio
        run: pnpm build
      - name: Enforce production bundle budgets
        run: pnpm verify:bundle
